# Keeps the site current during Worlds: downloads new international games, recomputes every
# Worlds view (ratings, standings, odds, previews), and commits the results. Streamlit Community
# Cloud redeploys on every push, so the site updates on its own.
name: Refresh Worlds data

on:
  schedule:
    - cron: "17 */3 * * *"  # every 3 hours, at :17 to stay off the top of the hour
  workflow_dispatch:         # "Run workflow" button on GitHub's Actions tab

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Refresh Worlds data
        id: refresh
        run: python -m lolpatch refresh

      - name: Commit changes, if any
        if: steps.refresh.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed data/forecasts data/overrides
          if git diff --cached --quiet; then
            echo "No new data."
            exit 0
          fi
          git commit -m "Data refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
